[package]
name = "vulkano-rhai-lsp"
version = "0.1.0"
edition = "2024"
description = "Language server for the engine's Rhai scripts: completion, hover, signature help, and errors."

[[bin]]
name = "vulkano-rhai-lsp"
path = "src/main.rs"

[dependencies]
vulkano-engine = { path = "../engine" }
vulkano-game = { path = "../game" }
rhai = { workspace = true }
shipyard = { workspace = true }
lsp-server = "0.7"
lsp-types = "0.97"
serde_json = "1"
